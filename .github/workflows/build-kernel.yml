name: Build Android Kernel

on:
  workflow_dispatch: # Cho phép bấm nút trigger thủ công trên GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Cài đặt các gói phụ thuộc (Dependencies)
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libncurses-dev bison flex libssl-dev libelf-dev \
          bc git-core gnupg ccache zip curl lzop libstdc++6 libc6-dev \
          python3 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
 
    - name: Tải Toolchain
      run: |
        # Xóa thư mục clang nếu đã tồn tại rác từ lần chạy trước
        rm -rf clang
        
        # Clone repo Clang mới
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git -b master clang
        
    - name: Biên dịch Kernel
      run: |
        
        # 1. Thêm Clang vào PATH
        export PATH="$(pwd)/clang/bin:$PATH"
        
        # 2. Khai báo các biến môi trường bắt buộc cho Clang LLVM
        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export CXX=clang++

        export HOSTCC=gcc
        export HOSTCXX=g++
        
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        
        # 3. Tạo defconfig
        make O=out LLVM=1 LLVM_IAS=1 munch_defconfig
        
        # 4. Tiến hành build với cờ LLVM=1 và LLVM_IAS=1
        make -j$(nproc --all) O=out LLVM=1 LLVM_IAS=1
        

    - name: Thu thập kết quả Build
      run: |
        # Kiểm tra xem file Image hoặc Image.gz-dtb đã được tạo chưa
        if [ -f "kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
          echo "Build thành công!"
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/
        elif [ -f "kernel/out/arch/arm64/boot/Image" ]; then
          mkdir -p artifacts
          cp kernel/out/arch/arm64/boot/Image artifacts/
        else
          echo "Không tìm thấy file Kernel đầu ra!" && exit 1
        fi

    - name: Tải Kernel lên Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Android-Kernel-Build
        path: artifacts/
        
